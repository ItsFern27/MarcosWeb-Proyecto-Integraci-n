<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Crear Proyecto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body">

    <div class="container my-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">

                <h1 class="fw-bold mb-4 text-center">Crear Nuevo Proyecto</h1>

                <form action="/mis-proyectos/crear" method="POST">

                    <!-- TÍTULO -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Título del proyecto</label>
                        <input type="text" class="form-control rounded-3" name="titulo" required>
                    </div>

                    <!-- DESCRIPCIÓN -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Descripción</label>
                        <textarea class="form-control rounded-3" name="descripcion" rows="4" required></textarea>
                    </div>

                    <!-- DURACIÓN -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Duración estimada</label>
                        <input type="text" class="form-control rounded-3" name="duracion" placeholder="Ej: 3 meses">
                    </div>

                    <button type="submit" class="btn btn-primary px-4 py-2 rounded-3">
                        Crear proyecto
                    </button>

                    <a href="/mis-proyectos" class="btn btn-outline-secondary px-4 py-2 rounded-3 ms-2">
                        Cancelar
                    </a>

                </form>

            </div>
        </div>
    </div>

</body>

</html>
