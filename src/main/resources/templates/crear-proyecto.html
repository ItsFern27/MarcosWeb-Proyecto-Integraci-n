<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear Nuevo Proyecto</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link href="/css/custom.css" rel="stylesheet" />
</head>

<body class="bg-body">

    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Content -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-4">

                    <!-- CREAR PROYECTO-->
                    <div class="card-body p-4 p-md-5">

                        <h1 class="fw-bold mb-4 text-center">Crear Nuevo Proyecto</h1>

                        <form action="/mis-proyectos/crear" method="POST">

                            <!-- TÍTULO -->
                            <div class="mb-4">
                                <label for="titulo" class="form-label fw-semibold">Título del proyecto</label>
                                <input type="text" id="titulo" class="form-control form-control-lg rounded-3" name="titulo" required>
                            </div>

                            <!-- DESCRIPCIÓN -->
                            <div class="mb-4">
                                <label for="descripcion" class="form-label fw-semibold">Descripción</label>
                                <textarea id="descripcion" class="form-control form-control-lg rounded-3" name="descripcion" rows="4" required></textarea>
                            </div>

                            <!-- DURACIÓN -->
                            <div class="mb-4">
                                <label for="duracion" class="form-label fw-semibold">Duración estimada</label>
                                <input type="text" id="duracion" class="form-control form-control-lg rounded-3" name="duracion" placeholder="Ej: 3 meses">
                            </div>
                            
                            <!-- URL IMAGEN -->
                            <div class="mb-4">
                                <label for="urlImagen" class="form-label fw-semibold">URL de la Imagen</label>
                                <input type="text" id="urlImagen" class="form-control form-control-lg rounded-3" name="urlImagen" placeholder="https://ejemplo.com/imagen.png">
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg px-4 py-2 rounded-3">
                                    Crear proyecto
                                </button>
                                <a href="/mis-proyectos" class="btn btn-outline-secondary btn-lg px-4 py-2 rounded-3">
                                    Cancelar
                                </a>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
