<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${Titulo}">Iniciar Sesión</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/custom.css" rel="stylesheet" />
</head>
<body class="bg-body d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <span class="brand-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
          </svg>
        </span>
        <span class="fw-bold text-dark">ProjectLinks</span>
      </a>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="card shadow-lg border-0 p-4" style="max-width: 420px; width: 100%;">
      <div class="text-center mb-4">
        <h3 class="fw-bold mb-2">Iniciar Sesión</h3>
        <p class="text-muted small">Accede a tu cuenta para continuar</p>
      </div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Correo electrónico</label>
          <input type="email" class="form-control" id="email" name="username" placeholder="tucorreo@ejemplo.com" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mt-2"></a>Iniciar Sesión</button>
      </form>

      <div class="text-center mt-3">
          <small class="text-muted">¿No tienes una cuenta?</small><br>
          <a class="btn btn-primary" href="/register">Crear una cuenta</a>
      </div>  
        
      
      
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center text-muted py-3 mt-auto">
    © 2025 ProjectLinks
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
