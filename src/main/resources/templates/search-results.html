<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de Búsqueda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-4">
        <h2>Resultados de la Búsqueda</h2>
        <p th:if="${titulo}">Para el título: <span th:text="${titulo}"></span></p>

        <div th:if="${proyectos.isEmpty()}">
            <p>No se encontraron proyectos con los criterios de búsqueda.</p>
        </div>

        <div th:unless="${proyectos.isEmpty()}" class="row">
            <div th:each="proyecto : ${proyectos}" class="col-md-4 mb-4">
                <div class="card">
                    <img th:src="${proyecto.urlImagen}" class="card-img-top" alt="Imagen del Proyecto">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${proyecto.titulo}"></h5>
                        <p class="card-text" th:text="${proyecto.descripcion}"></p>
                        <a th:href="@{/proyectos/{id}(id=${proyecto.id})}" class="btn btn-primary">Ver Detalles</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
