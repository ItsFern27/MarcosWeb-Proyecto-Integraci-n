<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- Footer -->
    <footer th:fragment="footer" class="bg-white border-top mt-5">
        <div class="container py-5">
            <div class="row g-4">
                <div class="col-12 col-md-4">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span class="brand-badge">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z">
                                </path>
                            </svg>
                        </span>
                        <span class="fw-bold">ProjectLinks</span>
                    </div>
                    <p class="text-muted mb-0">
                        Conecta con equipos, aporta a proyectos reales y haz crecer tu portafolio.
                    </p>
                </div>

                <div class="col-6 col-md-2">
                    <h6 class="fw-semibold mb-3">Producto</h6>
                    <ul class="list-unstyled">
                        <li><a class="text-decoration-none text-muted" href="#explorar">Explorar</a></li>
                        <li><a class="text-decoration-none text-muted" href="#crear">Crear</a></li>
                        <li><a class="text-decoration-none text-muted" href="#precios">Precios</a></li>
                    </ul>
                </div>

                <div class="col-6 col-md-2">
                    <h6 class="fw-semibold mb-3">Compañía</h6>
                    <ul class="list-unstyled">
                        <li><a class="text-decoration-none text-muted" href="#nosotros">Nosotros</a></li>
                        <li><a class="text-decoration-none text-muted" href="#blog">Blog</a></li>
                        <li><a class="text-decoration-none text-muted" href="#contacto">Contacto</a></li>
                    </ul>
                </div>

                <div class="col-12 col-md-4">
                    <h6 class="fw-semibold mb-3">Mantente al día</h6>
                    <form class="d-flex gap-2">
                        <input type="email" class="form-control" placeholder="Tu correo" aria-label="Tu correo">
                        <button class="btn btn-primary" type="submit">Suscribirme</button>
                    </form>
                </div>
            </div>

            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center pt-4 mt-4 border-top">
                <small class="text-muted">© 2025 ProjectLinks. Todos los derechos reservados.</small>
                <div class="d-flex gap-3 mt-3 mt-sm-0">
                    <a href="#privacidad" class="text-decoration-none text-muted">Privacidad</a>
                    <a href="#terminos" class="text-decoration-none text-muted">Términos</a>
                </div>
            </div>
        </div>
    </footer>

</body>

</html>
